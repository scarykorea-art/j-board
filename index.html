<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>3학년부 데일리 보드</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@keyframes shine{
  0%{transform:translateX(-110%)}
  to{transform:translateX(110%)}
}
@keyframes scr{
  0%{clip-path:inset(0 100%0 0);filter:blur(4px)}
  60%{filter:blur(1px)}
  to{clip-path:inset(0 0 0 0);filter:none}
}
@keyframes tkGlow{
  50%{transform:scale(.8);box-shadow:0 0 0 2px var(--card,#fff),0 0 3px 1px rgba(255,184,0,.45)}
}
@keyframes tkRing{
  0%{transform:scale(.5);opacity:1}
  to{transform:scale(1.9);opacity:0}
}
:root{--bg:#f3f6f2;--card:#fff;--ink:#17231d;--mut:#5f6d65;--line:#dbe3dc;--acc:#1f6b4c;--soft:#e2efe7;--warn:#8a3b2e}
@media (prefers-color-scheme:dark){
  :root{--bg:#111714;--card:#19211d;--ink:#e6ece8;--mut:#9aa7a0;--line:#2b3631;--acc:#62c194;--soft:#1e3529;--warn:#e59a8a}
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6"IBM Plex Sans KR",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:18px 14px 40px}
h1{font:700 1.5rem/1.2"Gowun Dodum","IBM Plex Sans KR",sans-serif;margin:4px 0 14px}
.tabs{display:flex;align-items:stretch;gap:6px;margin:0 0 12px;padding:2px 0 6px;overflow:hidden}
.tabs .tw{flex:1 1 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;min-width:0}
.tabs .nv{flex:0 0 34px;min-width:34px;padding:0;border-radius:10px;font-size:1.3rem;font-weight:800;color:var(--acc)}
.tabs .nv:disabled{opacity:.25;cursor:default}
.card,.tabs button{background:var(--card)}
.tabs button{flex:0 0 auto;min-width:0;padding:6px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:56px;border-radius:12px;border:2px solid var(--line);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;line-height:1.25}
.tabs button small{display:block;font-weight:400;font-size:.78rem;color:var(--mut)}
.tabs button[aria-selected=true]{border-color:var(--acc);background:var(--soft)}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:1rem}
.at,.hint{font-size:.75rem}
.hint{color:var(--mut);margin-top:8px}
.at{margin-top:10px}
.at,.empty,.foot{color:var(--mut)}
.foot{font-size:.78rem;text-align:center;margin-top:16px}
:root{--tk-ink:var(--ink);--tk-mut:var(--mut);--tk-acc:var(--acc);--tk-soft:var(--soft);--tk-line:var(--line);--tk-line2:#b9c6bd;--tk-red:#d23b3b;--tk-blue:#1f6fd1;--tk-green:#1f8a4c;--tk-orange:#d9750c}
@media (prefers-color-scheme:dark){
  :root{--tk-line2:#4a5a52;--tk-red:#ff7b7b;--tk-blue:#7cb4ff;--tk-green:#5fd08f;--tk-orange:#ffad5c}
}
.notice-card{border:2px solid var(--acc);padding:18px 18px 14px;box-shadow:0 6px 20px rgba(31,107,76,.1)}
.notice-card .nh{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.notice-card .nh h2{margin:0;font-size:1.2rem}
.tk{font-size:16px;line-height:1.6;color:var(--tk-ink)}
.tk-title{font-weight:800;font-size:1.15em;line-height:1.35;margin:0 0 4px}
.tk-h,.tk-left{color:var(--tk-acc)}
.tk-h{display:flex;align-items:center;gap:8px;font-weight:800}
.tk-left{margin-left:auto;font-size:.78em;font-weight:700;background:var(--tk-soft);border-radius:999px;padding:1px 9px}
.tk-left:empty{display:none}
.tk-item{display:flex}
.tk-ck{flex:none;border-radius:50%;background:0 0;padding:0;cursor:pointer}
span.tk-ck{cursor:default}
.tk-item.done .tk-ck{border-color:var(--tk-acc)}
.tk-item.done .tk-ck::after{content:"";position:absolute;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);left:6px;top:2px;width:5px;height:10px}
.tk-tx{flex:1;display:flex;min-width:0}
.tk-n{flex:none;font-weight:800}
.tk-bd{min-width:0}
.tk-item.done .tk-bd{text-decoration:line-through;text-decoration-thickness:2px}
.tk-item.done .tk-n{color:var(--tk-mut)}
.tk-bd,.tk-note,.tk-p{overflow-wrap:anywhere;word-break:keep-all}
.tk-note{margin:6px 0 0;padding:8px 12px;border-radius:10px;background:var(--tk-soft);font-size:.93em}
.tk-note::before{content:"※ ";font-weight:700;color:var(--tk-acc)}
.tk-gap{height:6px}
.tk-box{border-radius:14px;overflow:hidden;background:var(--tk-soft)}
.tk-bt{overflow-wrap:anywhere;word-break:keep-all}
.tk-row{display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:8px;border-top:1px solid var(--tk-line)}
.tk-bt+.tk-row{border-top:0}
.tk-k{white-space:nowrap}
.tk-row1,.tk-v{overflow-wrap:anywhere;word-break:keep-all}
.tk-row1{border-top:1px solid var(--tk-line);font-size:.93em}
.tk-r{color:var(--tk-red)}
.tk-b{color:var(--tk-blue)}
.tk-g{color:var(--tk-green)}
.tk-o{color:var(--tk-orange)}
.tk-L{font-size:1.25em;font-weight:700}
.tk-S{font-size:.85em}
.tk-h{font-size:1.05em;margin:2px 0 10px}
.tk-item{align-items:center;border:1px solid var(--tk-line);border-left:5px solid var(--tk-acc);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tk-item:first-of-type{border-top:1px solid var(--tk-line)}
.tk-tx{align-items:center;flex-wrap:nowrap}
.tk-n{font-size:.8em;color:var(--tk-mut);min-width:auto}
.tk-time{flex:none;font-variant-numeric:tabular-nums;color:#fff;background:var(--tk-acc);white-space:nowrap}
.tk-item.done{opacity:.55;box-shadow:none;border-left-width:1px}
.tk-item.done .tk-time{background:var(--tk-mut);text-decoration:line-through}
.tk-p{margin:12px 0 6px;padding:10px 14px;border-radius:12px;border:1px dashed var(--tk-line2);font-weight:600}
.tk-box{border:1.5px dashed var(--tk-line2);background:0 0;opacity:.7;font-size:.9em}
.tk-bt,.tk-k{color:var(--tk-mut)}
.tk-bt{font-weight:700;border-bottom:1px dashed var(--tk-line2);padding:7px 14px}
.tk-k{font-weight:600}
.tk-v{font-weight:500}
.tk-foot{background:linear-gradient(135deg,rgba(255,196,60,.18),rgba(255,150,40,.08));border:1px solid rgba(224,165,38,.45);border-left:5px solid #e0a526}
.tk-foot .tk-p{margin:0;border:0;border-radius:0}
.tk-foot .tk-note{margin:0;background:0 0;border-radius:0;border-top:1px dashed rgba(224,165,38,.5)}
.tk-foot .tk-note::before{color:#c98a0b;color:var(--tk-acc)}
.tk-foot .tk-gap{display:none}
.tk-foot>:first-child{border-top:0}
.tk-sec{margin:6px 0 8px;background:linear-gradient(180deg,var(--tk-soft),var(--card) 140%);box-shadow:0 3px 12px rgba(0,0,0,.07);background:var(--tk-soft)}
.tk-sec .tk-item{background:var(--card)}
.tk-sec .tk-item:last-of-type{margin-bottom:0}
.tk-sec .tk-foot{background-image:linear-gradient(135deg,rgba(255,196,60,.16),rgba(255,150,40,.06))}
.tk-sec>.tk-gap:last-child{display:none}
.tk-sec .tk-h{font-size:1em}
.tk-item{gap:8px;padding:7px 10px;margin:0 0 5px;border-left-width:4px;border-radius:10px;box-shadow:none}
.tk-item.done{padding:4px 10px}
.tk-tx{gap:7px}
.tk-foot,.tk-sec .tk-foot{background:var(--card)}
.tk-foot .tk-note,.tk-foot .tk-p{line-height:1.45}
.tk-sec .tk-foot:first-child{margin:0 0 8px}
.tk-box{margin:12px 0 4px}
.tk-row,.tk-row1{padding:4px 12px}
.tk-sec{background:var(--card);background-image:none;border:2px solid var(--tk-acc);border-radius:14px;padding:12px 14px;box-shadow:none}
.tk-sec .tk-h{margin:0 0 10px}
.tk-item,.tk-item.done,.tk-item:first-of-type,.tk-sec .tk-item{position:relative;display:block;margin:0 0 0 11px;padding:2px 0 10px 20px;border:0;border-left:2.5px solid var(--tk-acc);border-radius:0;background:0 0;box-shadow:none;opacity:1}
.tk-item.done{border-left-color:var(--tk-line2)}
.tk-ck{position:absolute;left:-12.5px;top:1px;width:22px;height:22px;margin:0;background:var(--card);border:2.5px solid var(--tk-acc)}
.tk-item.done .tk-ck{background:var(--tk-acc)}
.tk-tx{font-size:1em;font-weight:600}
.tk-item.done .tk-tx,.tk-tx{display:block;line-height:1.4}
.tk-n{display:none}
.tk-item.done .tk-time,.tk-time{width:fit-content;background:0 0;padding:0;border-radius:0;font-size:.82em;margin-bottom:1px}
.tk-time{color:var(--tk-acc);font-weight:800}
.tk-item.done .tk-time{display:block}
.tk-bd,.tk-time{display:block}
.tk-item.done .tk-time,.tk-item.done .tk-tx{color:var(--tk-mut);font-weight:500}
.tk-item.done .tk-tx{font-size:.92em}
.tk-foot,.tk-sec .tk-foot{margin:4px 0 0;padding:0 12px;border-radius:10px;background:rgba(0,0,0,.035);background-image:none;border:1.5px solid var(--tk-line2)}
.tk-foot .tk-p{padding:7px 0;font-size:.92em;font-weight:600}
.tk-foot .tk-note{padding:5px 0;font-size:.88em;border-top:1px dashed var(--tk-line2)}
.notice-card .tk-sec .tk-ck{display:block;width:14px;height:14px;left:-8.5px;top:5px;background:var(--tk-acc);border:0}
.tc{border:2px solid #b5651d;background:var(--card)}
.tc h2{display:flex;align-items:center;gap:8px;color:#b5651d}
@media (prefers-color-scheme:dark){
  .tc{border-color:#e0a060}
  .tc h2{color:#e0a060}
}
.tc .cnt2{margin-left:auto;font-size:.8rem;color:var(--mut);font-weight:600}
.ti{display:flex;gap:10px;padding:9px 2px;border-top:1px dashed var(--line);overflow-wrap:anywhere;word-break:keep-all}
.ti:first-of-type{border-top:0}
.ti .n{flex:none;min-width:1.4em;font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums}
.tg h3,.ti.sub{font-size:.92rem;color:var(--mut)}
.ti.sub,.ti.urg{padding:4px 2px 4px 2.2em;border-top:0}
.ti.urg{background:#fdeceb;border-radius:10px;padding:9px 10px;margin:4px 0}
.ti .tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}
.ti a{color:var(--acc)}
.tg h3{margin:12px 0 4px}
.tg h3:first-of-type{margin-top:0}
details.tg summary{cursor:pointer;font-weight:700;list-style:none}
.ad>summary::-webkit-details-marker,details.tg summary::-webkit-details-marker{display:none}
details.tg summary::before{content:"▸ ";color:var(--mut)}
details.tg[open] summary::before{content:"▾ "}
.gc h2,.sep{display:flex;align-items:center}
.offday,.sep{color:var(--mut)}
.sep{gap:10px;margin:18px 2px 10px;font-size:.82rem;font-weight:700}
.sep::after,.sep::before{content:"";flex:1;border-top:1px dashed var(--line)}
.offday{font-size:.9rem;text-align:center;padding:6px}
.foot a,.gx a{color:var(--acc);font-weight:700}
.notice-card .prog,.notice-card .tk-left{display:none}
.notice-card .nsub{margin:-4px 0 12px;font-size:.85rem;color:var(--mut)}
.notice-card .cpbox,.notice-card .nh .cp{font:inherit;font-size:.85rem;border-radius:10px}
.notice-card .nh .cp{margin-left:auto;min-height:40px;padding:6px 14px;border:1px solid var(--acc);background:var(--acc);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.notice-card .cpbox{width:100%;min-height:160px;margin-top:10px;border:1px solid var(--line);padding:8px;background:var(--bg);color:var(--ink)}
@media (prefers-color-scheme:dark){
  .ti.urg{background:#3a1f1c}
}
.gc{border:2px solid #7a3fb0;background:var(--card)}
.gc h2{gap:8px;color:#7a3fb0}
.gc .cnt2{margin-left:auto;font-size:.8rem;color:var(--mut);font-weight:600}
.gi{padding:10px 0;border-top:1px dashed var(--line)}
.gi:first-of-type{border-top:0;padding-top:0}
.gt,.gx{word-break:keep-all;overflow-wrap:anywhere}
.gt{font-weight:800;margin-bottom:4px}
.gx{white-space:pre-wrap;font-size:.95rem}
@media (prefers-color-scheme:dark){
  .gc{border-color:#c59af0}
  .gc h2{color:#c59af0}
}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h1{margin:0;flex:1}
.tb{flex:none;min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--acc);background:var(--card);color:var(--acc);font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
.top{gap:6px}
/* 제목줄 정리 (11/24): 제목 한 줄, 버튼은 작은 알약 */
.top h1{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(1.12rem,5.4vw,1.5rem);letter-spacing:-.01em}
.top h1 .hi{font-size:.82em;margin-right:5px;vertical-align:.04em}
.top .tb,.top .eb{min-height:36px;padding:4px 10px;border-radius:999px;font-size:.8rem;display:inline-flex;align-items:center;gap:4px;line-height:1}
.top .bi{font-style:normal;font-size:.95em}
@media(max-width:380px){.tabs .tw button{font-size:.86rem;padding:6px 1px;letter-spacing:-.02em}.tabs .nv{flex-basis:28px;min-width:28px}}
.sync{margin:-8px 0 10px;font-size:.8rem;color:var(--mut)}
/* ✅ 현재원 체크 */
.ick h2 .ickhn{font-size:.82rem;font-weight:700;color:var(--acc)}
.icksub{font-size:.85rem;color:var(--mut);margin:6px 0}
.ickpin{display:flex;gap:6px;margin-top:6px}.ickpin input{flex:1;min-width:0;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;background:var(--bg);color:var(--ink)}
.ickpin button{min-height:40px;padding:6px 14px;border-radius:8px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.ickc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:4px}
.ickc button{min-height:44px;padding:4px 2px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:.88rem;cursor:pointer;line-height:1.2}
.ickc button small{display:block;font-weight:400;font-size:.68rem;color:var(--mut)}
.ickc button[aria-pressed=true]{border-color:var(--acc);background:var(--soft);color:var(--acc)}
.ickh2{display:flex;align-items:baseline;gap:10px;margin-top:12px}.ickh2>b{flex:1}
.ickn{font-size:1.05rem;color:var(--mut);font-variant-numeric:tabular-nums}.ickn b{font-size:1.6rem;color:var(--ink)}.ickn.done b{color:var(--acc)}
.ckl{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ckl li{display:grid;grid-template-columns:30px 1.6em 1fr auto;gap:10px;align-items:center;padding:7px 10px 7px 12px;border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.ckl li:first-child{border-top:0}.ckl li.in{background:var(--soft)}
.ckl .box{width:30px;height:30px;border-radius:7px;border:2px solid var(--mut);background:transparent;display:grid;place-items:center;color:#fff;padding:0;cursor:pointer}
.ckl li.in .box{background:var(--acc);border-color:var(--acc)}
.ckl .box svg{width:18px;height:18px;opacity:0}.ckl li.in .box svg{opacity:1}
.ckl .no{color:var(--mut);font-size:.8rem;font-variant-numeric:tabular-nums}
.ckl .nm{font-weight:600;min-width:0}.ckl .nm em{font-style:normal;font-size:.72rem;font-weight:700;color:var(--acc);margin-left:6px}
.ickx{min-height:30px;padding:2px 9px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-size:.75rem;cursor:pointer}
.ickwhy{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;padding:2px 0 4px 40px}
.ickwhy button{min-height:34px;padding:3px 12px;border-radius:8px;border:1.5px solid var(--warn);background:var(--card);color:var(--warn);font:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.ickwhy button.cx{border-color:var(--line);color:var(--mut);font-weight:400}
.ickg{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:8px;font-size:.8rem;color:var(--mut)}
.ickg>span{font-weight:700;margin-right:2px}
.ickg button{min-height:30px;padding:2px 8px;border-radius:999px;border:1px dashed var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.8rem;cursor:pointer}
.ickg button small{color:var(--warn);font-weight:700}
.ickres{margin-top:12px;padding:14px 16px;border-radius:14px;border:3px solid var(--warn);background:var(--card)}
.ickres.all{border-color:var(--acc)}
.ickres .irh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.ickres .irh b{flex:1;font-size:1rem}.ickres .irh span{font-size:.85rem;color:var(--mut);font-variant-numeric:tabular-nums}
.ickres .irn{margin-top:4px;font-size:.88rem;color:var(--mut)}.ickres .irn b{color:var(--ink)}
.ickres .irm{margin-top:10px;font-weight:700;color:var(--warn)}.ickres .irm b{font-size:1.2rem}
.ickres .irl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ickres .irl span{font-size:1.25rem;font-weight:800;padding:4px 12px;border-radius:10px;background:var(--bg);border:2px solid var(--warn);color:var(--warn)}
.ickres .irl i{font-style:normal;font-size:.75rem;font-weight:600;margin-right:5px;color:var(--mut)}
.ickres .irok{margin-top:8px;font-size:1.3rem;font-weight:800;color:var(--acc)}
.ickf{display:flex;align-items:center;gap:8px;margin-top:8px}.ickf .hint{flex:1;margin:0;font-size:.75rem;color:var(--mut)}
.ickr{flex:none;min-height:36px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.78rem;cursor:pointer}
.ickr:disabled{opacity:.4;cursor:default}.ickr.warn{border-color:var(--warn);color:var(--warn)}
.eb,.gsum span{white-space:nowrap}
.eb{min-height:44px;padding:6px 14px;border-radius:10px;border:1px solid #7a3fb0;background:var(--card);color:#7a3fb0;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.eb.on{background:#7a3fb0;color:#fff}
.gc.editing{border-style:dashed}
.gr{font-size:.78rem;color:var(--mut);margin:-2px 0 4px}
.ga,.pf{display:flex;flex-wrap:wrap}
.ga{gap:6px;margin-top:8px}
.pf{gap:8px;align-items:flex-end}
.pf label{flex:1;min-width:180px}
.gf label,.pf label{display:grid;gap:4px;font-size:.85rem;font-weight:700;color:var(--mut)}
.gf input,.gf select,.gf textarea,.pf input{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.gb button,.pf button{color:#fff}
.add,.ga button,.gb button,.pf button{min-height:44px;padding:6px 14px;border-radius:10px;border:1px solid #7a3fb0;background:#7a3fb0;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.add,.ga button,.gb .ghost,.pf .ghost{background:var(--card);color:#7a3fb0}
.ga .del{border-color:var(--warn);color:var(--warn)}
.add{width:100%;margin-top:10px;border-style:dashed}
.gd,.gf{display:grid;gap:8px}
.gf{padding:10px 0;border-top:1px dashed var(--line)}
.gd{grid-template-columns:1fr 1fr}
.gb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{font-size:.85rem;color:var(--warn)}
.gf label.fb,.gu{align-items:center}
.gu{display:flex;flex-wrap:wrap;gap:8px}
.gf label.fb{display:inline-flex;min-height:44px;padding:6px 14px;border-radius:10px;border:1px dashed #7a3fb0;color:#7a3fb0;font-weight:700;font-size:.85rem;cursor:pointer}
.gsum,.gtog{background:0 0;font:inherit}
.gsum{display:flex;width:100%;gap:6px;border:0;padding:4px 0;font-size:.95rem;color:var(--ink);text-align:left;cursor:pointer}
